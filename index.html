<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Cloche</title>
<meta name="description" content="A living world under a glass bell, for iPhone.">
<style>
:root { --bg: #f7f4ee; --ink: #22201c; --muted: #6b655c; --rule: #ddd6ca; --link: #7a5236; }
@media (prefers-color-scheme: dark) { :root { --bg: #15110e; --ink: #f2ece1; --muted: #b7afa3; --rule: #3a322b; --link: #e6c887; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 48px 20px 80px; }
nav { font-size: 15px; color: var(--muted); margin-bottom: 32px; }
nav a { color: var(--link); text-decoration: none; margin-right: 16px; }
h1 { font-size: 30px; line-height: 1.25; margin: 0 0 4px; font-weight: 600; }
h2 { font-size: 19px; margin: 32px 0 8px; font-weight: 600; }
p, li { margin: 0 0 12px; }
ul { padding-left: 22px; }
em { color: var(--muted); font-style: normal; font-size: 15px; }
a { color: var(--link); }
section + section { border-top: 1px solid var(--rule); margin-top: 56px; padding-top: 40px; }
</style>
</head>
<body>
<main>
<h1>La Cloche</h1>
<p>A living world under a glass bell, for iPhone. Real rain, real rivers, real seasons, and it keeps living while you are away.</p>
<p lang="fr">Un monde vivant sous une cloche de verre, pour iPhone.</p>
<p><a href="privacy/">Privacy Policy</a> · <a href="privacy/#fr">Politique de confidentialité</a> · <a href="mailto:damien@chedan.fr">damien@chedan.fr</a></p>
</main>
</body>
</html>
